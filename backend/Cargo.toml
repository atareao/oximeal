[package]
name = "oximeal-backend"
version = "0.4.0"
edition = "2024"

[lib]
name = "oximeal_backend"
path = "src/lib.rs"

[[bin]]
name = "oximeal-backend"
path = "src/main.rs"

[features]
default = []
# Sirve el frontend compilado (`frontend/dist`) desde el propio binario.
embed-ui = ["dep:rust-embed", "dep:mime_guess"]

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.89"
axum = "0.8"
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15.7"
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"] }
mime_guess = { version = "2.0.5", optional = true }
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "form"] }
rust-embed = { version = "8.13.0", optional = true, features = ["interpolate-folder-path"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite", "macros", "migrate", "uuid", "chrono", "json"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal"] }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["trace", "cors"] }
tower-sessions = { version = "0.15.0", features = ["signed"] }
tower-sessions-core = { version = "0.15.0", features = ["deletion-task"] }
time = "0.3.44"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
utoipa = "6.0.0"
utoipa-swagger-ui = { version = "10.0.2", features = ["axum"] }
uuid = { version = "1.29.0", features = ["v4", "serde"] }

[dev-dependencies]
http-body-util = "0.1.5"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["test-util"] }
tower = { version = "0.5.3", features = ["util"] }
wiremock = "0.6.5"
